# Copy to docs/demo/local/flock.toml. The recording shows these names and
# hosts as written, so use ssh aliases rather than addresses.
#
# To give the demo's tasks a model without passing --agent-arg each time,
# declare the flock and its agent:
#
# [[flock]]
# name = "default"
# default = true
# agent = "claude"
# agent_args = ["--model", "claude-sonnet-5"]
# allow = ["Read", "Edit", "Bash(git:*)"]   # tools the agent may use unasked
# deny = ["Bash(git push:*)"]              # never; wins over allow

[[machine]]
name = "pi-1"
ssh = "pi-1"
max_agents = 3
tags = ["fast"]

[[machine]]
name = "pi-2"
ssh = "pi-2"
max_agents = 3
