# The pastor website: a homepage and short docs pages, one topic each, drawn
# like a small TUI. The docs are for people learning pastor; docs/manual.md
# stays in the repo for agents and is not part of the site.
#
# It is served at https://cacari.co/pastor/: the blog repo copies a build
# into its static/pastor/ with scripts/sync-pastor-site.sh. Relative URLs keep
# it working under that subpath.

baseURL = "/"
relativeURLs = true
title = "pastor"
disableKinds = ["taxonomy", "term", "rss", "sitemap"]

[params]
repo = "https://github.com/cacarico/pastor"
blog = "https://cacari.co/posts/pastor/"

# Pages may use a little raw HTML, such as <details> around a long script.
# The content is ours, in the repo; nothing a visitor sends is rendered.
[markup.goldmark.renderer]
unsafe = true

# A page's topics in the nav: its ## headings.
[markup.tableOfContents]
startLevel = 2
endLevel = 2


# Mounting a component replaces its default, so content and static are
# listed again.
[[module.mounts]]
source = "content"
target = "content"

[[module.mounts]]
source = "static"
target = "static"

# The install script is served from the site, so the install command points
# here; it is the repo's own install.sh, not a copy that could drift.
[[module.mounts]]
source = "../../install.sh"
target = "static/install.sh"

# The homepage's terminal transcript.
[[module.mounts]]
source = "data"
target = "data"

# The version in the header comes from Cargo.toml, so it cannot go stale.
[[module.mounts]]
source = "../../Cargo.toml"
target = "data/cargo.toml"

# llms.txt (https://llmstxt.org) at the site's root, for agents: the docs
# pages in reading order, rendered from layouts/home.llms.txt, so it lists
# the same pages the nav does and cannot drift from them.
[outputFormats.llms]
mediaType = "text/plain"
baseName = "llms"
isPlainText = true
notAlternative = true

[outputs]
home = ["html", "llms"]
