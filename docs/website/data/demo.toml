# The homepage's live terminal: two acts that static/term.js types out, and
# that read as a plain transcript without it. The output copies pastor's own
# tables with placeholder names. Every `cmd` must be a real pastor command:
# website_demo_commands_are_real checks them as the docs' commands are.

[[act]]
label = "by hand"
kind = "shell"

[[act.step]]
cmd = "pastor flock list"

[[act.step]]
out = '''
NAME      DEFAULT  MACHINES                AGENTS  QUEUED
personal  yes      desk 1/2, server-1 2/3  3       0
work      no       laptop 0/2              0       0'''

[[act.step]]
cmd = '''
pastor task run "Fix the flaky login test" --repo '~/src/app' --worktree --model sonnet --profile develop'''

[[act.step]]
out = '''
ID    STATE   PRIORITY  MACHINE  FLOCK     AGENT   MODEL   JOB  AGE  NOTE
t-12  queued  normal    -        personal  claude  sonnet  run  0s   Fix the flaky login test'''

[[act.step]]
cmd = '''
pastor task run "Triage the new issues" --repo '~/src/tracker' --flock work --priority high'''

[[act.step]]
out = '''
ID    STATE   PRIORITY  MACHINE  FLOCK  AGENT   MODEL  JOB  AGE  NOTE
t-13  queued  high      -        work   claude  -      run  0s   Triage the new issues'''

[[act.step]]
cmd = "pastor job run morning"

[[act.step]]
out = "started job morning"

[[act.step]]
cmd = "pastor queue"

[[act.step]]
out = '''
POS  TASK  LEVEL   WHERE           FROM         WAITED  WHY NOT YET
1    t-15  normal  flock personal  job morning  6s      flock personal is full
2    t-16  normal  flock personal  job morning  6s      flock personal is full'''

[[act.step]]
cmd = "pastor task list"

[[act.step]]
out = '''
ID    STATE    PRIORITY  MACHINE   FLOCK     AGENT   MODEL   JOB      AGE  NOTE
t-12  running  normal    server-1  personal  claude  sonnet  run      1m   Fix the flaky login test
t-13  blocked  high      laptop    work      claude  -       run      1m   agent asked: label them as bugs, or ask first?
t-14  running  normal    desk      personal  claude  -       morning  40s  Update the dependencies
t-15  queued   normal    -         personal  claude  -       morning  40s  Run the test suite
t-16  queued   normal    -         personal  claude  -       morning  40s  Sort the inbox notes'''

[[act]]
label = "Running commands by hand is cool, but pastor is even more powerful in the hands of agents."
kind = "agent"

[[act.step]]
ask = "keep the PRs on app moving, and tell me if anything is stuck"

[[act.step]]
cmd = "pastor task list --blocked --json | jq -c '.[] | {id, state, error}'"

[[act.step]]
out = '''
{"id":13,"state":"blocked","error":"agent asked: label them as bugs, or ask first?"}'''

[[act.step]]
cmd = "pastor task read t-13 --lines 3"

[[act.step]]
out = '''
  Found 4 new issues. 3 are crashes with a stack trace.
  Label them as bugs, or ask first?'''

[[act.step]]
cmd = '''
pastor task send t-13 "label them as bugs"'''

[[act.step]]
out = "sent text to t-13"

[[act.step]]
cmd = '''
pastor task run "Address the review on #42" --repo '~/src/app' --worktree --model sonnet'''

[[act.step]]
out = '''
ID    STATE   PRIORITY  MACHINE  FLOCK     AGENT   MODEL   JOB  AGE  NOTE
t-17  queued  normal    -        personal  claude  sonnet  run  0s   Address the review on #42'''

[[act.step]]
cmd = '''
pastor task run "CI is red on main: find out why" --repo '~/src/app' --priority critical --preempt'''

[[act.step]]
out = '''
ID    STATE   PRIORITY  MACHINE  FLOCK     AGENT   MODEL  JOB  AGE  NOTE
t-18  queued  critical  -        personal  claude  -      run  0s   CI is red on main: find out why'''

[[act.step]]
report = '''
t-13 asked about labels; I told it to label them as bugs.
The review on #42 is being addressed in t-17.
CI on main is red: t-18 jumped the queue and paused a low task. Nothing needs you yet.'''
