# Mirrors .github/workflows/changelog.yml: a cheap changelog-format check
# that runs even on pull requests ci.yaml's path filter skips (see that
# file's comment). No Rust build, just the shell script.
when:
  - event: pull_request
    path:
      include:
        - "CHANGELOG.md"
        - "changes/**"
        - "scripts/changelog.sh"
        - ".woodpecker/changelog.yaml"
  - event: manual

steps:
  - name: changelog-check
    image: alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    commands:
      - apk add --no-cache bash make git gawk
      - make changelog-check
