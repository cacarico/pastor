# Mirrors .github/workflows/website.yml, build side only: this is the
# private repo, so Pages deploy never applies here (it's guarded to
# cacarico/pastor in the GitHub workflow, and Woodpecker never runs there
# at all). Hugo and lychee are pinned releases checked against their
# published checksums, same as the GitHub workflow, just the arm64 tarballs.
when:
  - event: pull_request
    path:
      include:
        - "docs/**"
        - "README.md"
        - "skills/**"
        - "Cargo.toml"
        - "Makefile"
        - ".woodpecker/website.yaml"
  - event: push
    branch: main
    path:
      include:
        - "docs/**"
        - "README.md"
        - "skills/**"
        - "Cargo.toml"
        - "Makefile"
        - ".woodpecker/website.yaml"
  - event: manual

steps:
  - name: build
    image: alpine:3.20
    commands:
      - apk add --no-cache curl make
      - curl -sSLo /tmp/hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v0.166.0/hugo_0.166.0_linux-arm64.tar.gz"
      - echo "0e15cbc595e799401698c11af39d2594b64292b39d9ec7a19665bd43e05fcb2c  /tmp/hugo.tar.gz" | sha256sum -c -
      - tar -xzf /tmp/hugo.tar.gz -C /usr/local/bin hugo
      - curl -sSLo /tmp/lychee.tar.gz "https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-aarch64-unknown-linux-musl.tar.gz"
      - echo "5d0b0e3aeab240f41920c633a6eaf97599be6eedda034b36e858ede7dba5e535  /tmp/lychee.tar.gz" | sha256sum -c -
      - tar -xzf /tmp/lychee.tar.gz -C /usr/local/bin --strip-components=1 lychee-aarch64-unknown-linux-musl/lychee
      - make site
      - make links
