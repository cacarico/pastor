# Pull requests merge with a merge commit (`gh pr merge --merge`) and no
# other way: not `--rebase`, not `--squash`, and not a push of the PR's head
# straight to main.
# `pull_request` runs CI on GitHub's merge of the PR into main as main was
# when the run started. main can move before the PR merges, so two PRs
# green on their own run can still break main together (#8 and #14 did,
# fixed in #21). So `check` (with `make test-machine` and `make test-ssh`)
# and `portability` run on push to main too, on the tree main really has.
# `workflow_dispatch` keeps a manual way to re-check any ref. `paths:`
# skips docs-only changes, since these jobs only exercise what they build
# or read, but not the docs the tests read (README.md, docs/manual.md,
# docs/recommended-setup.md, the website content, everything under
# skills/, the plugin manifest). On push to main it also takes
# CHANGELOG.md and changes/**, which `make check` reads through
# `scripts/changelog.sh check`: the changelog workflow runs only on pull
# requests, so a changelog-only merge would otherwise go unchecked on main.
# gitleaks has no such filter because a secret can land in any file.
name: ci

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "skills/**"
      - "README.md"
      - "docs/manual.md"
      - "docs/recommended-setup.md"
      - "docs/website/content/**"
      - ".claude-plugin/plugin.json"
      - "contrib/systemd/**"
      - "contrib/launchd/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Makefile"
      - "scripts/changelog.sh"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
      - "install.sh"
      - ".github/actions/**"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "skills/**"
      - "README.md"
      - "docs/manual.md"
      - "docs/recommended-setup.md"
      - "docs/website/content/**"
      - ".claude-plugin/plugin.json"
      - "contrib/systemd/**"
      - "contrib/launchd/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Makefile"
      - "scripts/changelog.sh"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
      - "install.sh"
      - ".github/actions/**"
      - "CHANGELOG.md"
      - "changes/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1, 2026-09-12
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # fmt-check, clippy -D warnings and the whole suite, including
      # tests/cli.rs against fake-herdr.
      - run: make check
      # The machine actor tests on their own.
      - run: make test-machine
      # The CLI against a head over a real ssh: every other test runs a fake
      # ssh, which let a ControlPath too long for a unix socket through in
      # 0.7.0. sshd runs as the runner's user; /run/sshd is the privilege
      # separation dir it checks for at start.
      - run: |
          sudo apt-get install -y --no-install-recommends openssh-server
          sudo mkdir -p /run/sshd
      - run: make test-ssh

  # Cargo.toml's rust-version is a promise every other job, on stable, never
  # tests; this job does, so a newer language feature fails here, not for
  # whoever builds from source on that toolchain. A `cargo check` of every
  # target is enough: MSRV breaks are compile errors.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1, 2026-09-12
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --locked --all-targets

  # The release builds are static musl binaries and a FreeBSD build is the
  # source-only route, so a change that only compiles against glibc on
  # x86_64 must fail here, on the pull request, not on the tag. This is a
  # `cargo check`, not a build or a test: it catches platform-specific code
  # (cfg gates, libc constants, missing symbols) at compile time, which is
  # where every portability break so far would have shown up. aarch64 is
  # left out because it goes through the same musl code paths as x86_64.
  portability:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1, 2026-09-12
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl, armv7-unknown-linux-musleabihf, x86_64-unknown-freebsd
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: ./.github/actions/zig
      - run: make portability
