name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # fmt-check, clippy -D warnings and the whole suite, including
      # tests/cli.rs against fake-herdr.
      - run: make check
      # The machine actor tests five times over, to catch timing flakes.
      - run: make test-machine
