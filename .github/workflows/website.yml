# Builds docs/website with Hugo. It runs on pushes to main and on pull
# requests that touch the docs (the site renders docs/manual.md and the
# pages under docs/website) or Cargo.toml (the header shows the version),
# and by hand. It also checks internal links (`make links`): the built site,
# and README.md, docs/*.md and skills/**/*.md, which is why those paths
# trigger it too. Hugo and lychee are pinned releases checked against their
# published checksums, and every action is pinned to a commit, as in
# release.yml.
#
# The site deploys to GitHub Pages only from cacarico/pastor, where Pages
# is set to "GitHub Actions". In any other copy of the repo (the private
# one, forks) Pages is off: the build still runs, so a broken site shows,
# but configure-pages (which fails where Pages is off) and the deploy are
# skipped. On a pull request the built site is uploaded as the `website`
# artifact: download it from the run, unzip it and serve the folder
# (`python3 -m http.server` in it). Opening index.html from disk does not
# work: the pretty URLs (docs/install/) show a folder listing there.
name: website

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "skills/**"
      - "Cargo.toml"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - "skills/**"
      - "Cargo.toml"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits instead of cancelling a deploy
# half way. Pull requests get a group of their own, so they never queue
# behind a deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.166.0
  LYCHEE_VERSION: 0.24.2

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Hugo
        run: |
          set -eu
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          tarball="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSLO --retry 5 --retry-delay 5 --retry-all-errors "$base/$tarball"
          curl -fsSLO --retry 5 --retry-delay 5 --retry-all-errors "$base/hugo_${HUGO_VERSION}_checksums.txt"
          grep " $tarball\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/hugo"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/hugo" hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"
      - name: Install lychee
        run: |
          set -eu
          base="https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}"
          tarball="lychee-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSLO --retry 5 --retry-delay 5 --retry-all-errors "$base/$tarball"
          curl -fsSLO --retry 5 --retry-delay 5 --retry-all-errors "$base/$tarball.sha256"
          sha256sum -c "$tarball.sha256"
          mkdir -p "$RUNNER_TEMP/lychee"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/lychee" --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
          echo "$RUNNER_TEMP/lychee" >> "$GITHUB_PATH"
      - run: make site
      # Builds the site again (fast) and checks its links and the repo
      # Markdown's; internal links and anchors only, nothing external.
      - run: make links
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website
          path: docs/website/public
          retention-days: 7
      - if: github.repository == 'cacarico/pastor' && github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - if: github.repository == 'cacarico/pastor' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/website/public

  deploy:
    needs: build
    if: github.repository == 'cacarico/pastor' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
