name: gitleaks

# The repository is public. Every push and pull request scans the whole
# history of every ref, so a secret cannot sit quietly in an old
# commit. gitleaks-action only scans the commits of the triggering event, so
# the binary runs here directly, pinned by version and checksum. The rules
# come from gitleaks' own default config at that same version, fetched
# outside the checkout, no .gitleaksignore is read and inline gitleaks:allow
# comments are ignored, so a pull request cannot loosen the policy it is
# checked against.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks and its default rules outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -o gitleaks.tgz "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" checksums.txt | sed 's/ .*/  gitleaks.tgz/' | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          curl -sSfL -o gitleaks.toml "https://raw.githubusercontent.com/gitleaks/gitleaks/v${GITLEAKS_VERSION}/config/gitleaks.toml"
          mkdir -p no-ignore
      - name: Scan every ref
        run: |
          git fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*'
          "${RUNNER_TEMP}/gitleaks" git --redact --no-banner --exit-code 1 --ignore-gitleaks-allow \
            --config "${RUNNER_TEMP}/gitleaks.toml" \
            --gitleaks-ignore-path "${RUNNER_TEMP}/no-ignore" \
            --log-opts="--all" .
