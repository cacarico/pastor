# Published on crates.io as pastor-cli, because the `pastor` name there
# belongs to another project. The library and the installed binary are
# still called pastor.
[package]
name = "pastor-cli"
version = "0.8.0"
edition = "2024"
# Let chains (stable since 1.88) are used throughout; raising this is a
# minor bump, see CONTRIBUTING.md.
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/cacarico/pastor"
description = "Run coding agents on machines you own, through herdr"
readme = "README.md"
keywords = ["agents", "herdr", "fleet", "daemon", "cli"]
categories = ["command-line-utilities", "development-tools"]
# What `cargo publish` uploads: what the pastor binary builds from, and
# nothing else. fake-herdr (src/bin and src/herdr/fake.rs) is a test double
# for the suite, so it stays out and `cargo install pastor-cli` installs
# pastor alone.
include = [
    "/src/**/*.rs",
    "!/src/bin/**",
    "!/src/herdr/fake.rs",
    "/skills/pastor/SKILL.md",
    "/contrib/systemd/*.service",
    "/contrib/launchd/*.plist",
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
]

[lib]
name = "pastor"
path = "src/lib.rs"

[[bin]]
name = "pastor"
path = "src/main.rs"

# The fake herdr: the `fake-herdr` binary and `pastor::herdr::fake`. Both
# need this feature; the Makefile turns it on for every target that does,
# including the library's own unit tests, so a plain `cargo test` still
# succeeds on the published crate, which leaves src/herdr/fake.rs out.
[features]
fake-herdr = []

[[bin]]
name = "fake-herdr"
path = "src/bin/fake-herdr.rs"
required-features = ["fake-herdr"]

# The integration tests that run the fake herdr; a plain `cargo test` skips
# them with a note naming the feature.
[[test]]
name = "cli"
required-features = ["fake-herdr"]

[[test]]
name = "connector"
required-features = ["fake-herdr"]

[[test]]
name = "events"
required-features = ["fake-herdr"]

[[test]]
name = "real_ssh"
required-features = ["fake-herdr"]

[[test]]
name = "transport"
required-features = ["fake-herdr"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = { version = "0.10.4", default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
dirs = "7.0.0"
libc = "0.2.189"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = [
    "io-std",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
toml = "1.1.6"
toml_edit = "0.25.15"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
# Only for `#[cfg_attr(test, mutants::skip)]` on an equivalent mutant (see
# .cargo/mutants.toml): the attribute exists in test builds alone, so the
# shipped binary never links it.
mutants = "0.0.4"
proptest = "1.11.0"
tempfile = "3.27.0"
# `start_paused` and a clock the machine actor tests can move: test builds only.
tokio = { version = "1.53.1", features = ["test-util"] }

# The daemon mostly waits on sockets, so build time is cheap to spend on a
# smaller binary: a Pi downloads and stores it, and nobody debugs a release
# build with symbols.
[profile.release]
strip = true
lto = true

# cargo-binstall fetches the tarballs that .github/workflows/release.yml
# publishes instead of compiling:
#   cargo binstall pastor-cli
# The tarballs keep the binary's name, pastor, not the crate's, so the URLs
# spell it out rather than use { name }. Only musl Linux binaries are
# released; the overrides send glibc hosts to them so one Linux flavour
# covers every distro.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/pastor-{ version }-{ target }.tar.gz"
bin-dir = "pastor-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/pastor-{ version }-x86_64-unknown-linux-musl.tar.gz"
bin-dir = "pastor-{ version }-x86_64-unknown-linux-musl/{ bin }"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/pastor-{ version }-aarch64-unknown-linux-musl.tar.gz"
bin-dir = "pastor-{ version }-aarch64-unknown-linux-musl/{ bin }"

[package.metadata.binstall.overrides.riscv64gc-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/pastor-{ version }-riscv64gc-unknown-linux-musl.tar.gz"
bin-dir = "pastor-{ version }-riscv64gc-unknown-linux-musl/{ bin }"

[package.metadata.binstall.overrides.armv7-unknown-linux-gnueabihf]
pkg-url = "{ repo }/releases/download/v{ version }/pastor-{ version }-armv7-unknown-linux-musleabihf.tar.gz"
bin-dir = "pastor-{ version }-armv7-unknown-linux-musleabihf/{ bin }"
